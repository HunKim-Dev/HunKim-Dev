<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%" role="img" aria-label="Taehun Kim — Product Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060E"/>
      <stop offset="60%" stop-color="#0A0F24"/>
      <stop offset="100%" stop-color="#16204A"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7D6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#FFF7D6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFF7D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveFade1" x1="0" y1="250" x2="0" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26356B" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#26356B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFade2" x1="0" y1="276" x2="0" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D4F92" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3D4F92" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFade3" x1="0" y1="294" x2="0" y2="324" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A6BB0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5A6BB0" stop-opacity="0"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="845" cy="72" r="30" fill="#fff"/>
      <circle cx="831" cy="62" r="28" fill="#000"/>
    </mask>
    <clipPath id="waveEdge">
      <path class="waveShift" d="M-500 -10 H1500 V268
        Q1437.5 248 1375 268 T1250 268 T1125 268 T1000 268 T875 268 T750 268 T625 268 T500 268 T375 268 T250 268 T125 268 T0 268 T-125 268 T-250 268 T-375 268 T-500 268 Z"/>
    </clipPath>
    <style>
      .star { fill: #FFFFFF; }
      .tw1 { animation: twinkle 2.4s ease-in-out infinite; }
      .tw2 { animation: twinkle 3.1s ease-in-out 0.6s infinite; }
      .tw3 { animation: twinkle 2.0s ease-in-out 1.1s infinite; }
      .tw4 { animation: twinkle 3.6s ease-in-out 1.7s infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .shoot {
        stroke: #E8F0FF; stroke-width: 2; stroke-linecap: round;
        animation: shoot 3.5s ease-in 1s infinite;
        opacity: 0;
      }
      .shoot2 {
        stroke: #E8F0FF; stroke-width: 1.5; stroke-linecap: round;
        animation: shoot 4.5s ease-in 2.8s infinite;
        opacity: 0;
      }
      @keyframes shoot {
        0% { transform: translate(0, 0); opacity: 0; }
        4% { opacity: 0.9; }
        16% { transform: translate(-280px, 100px); opacity: 0; }
        100% { transform: translate(-280px, 100px); opacity: 0; }
      }
      .waveShift { animation: waveMove 10s linear infinite; }
      .waveShift2 { animation: waveMove 14s linear infinite reverse; }
      .waveShift3 { animation: waveMove 18s linear infinite; }
      .waveShift4 { animation: waveMove 24s linear infinite reverse; }
      @keyframes waveMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-250px); }
      }
      .title { font: 700 52px 'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif; fill: #F5F7FF; }
      .subtitle { font: 400 19px 'Segoe UI', 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif; fill: #D6E0FA; letter-spacing: 4px; }
    </style>
  </defs>

  <g clip-path="url(#waveEdge)">
    <rect width="1000" height="300" fill="url(#sky)"/>

    <!-- moon -->
    <circle cx="845" cy="72" r="68" fill="url(#moonGlow)"/>
    <circle cx="845" cy="72" r="30" fill="#FFF3C4" mask="url(#crescent)"/>

    <!-- stars -->
    <g>
      <circle class="star tw1" cx="80"  cy="40"  r="1.8"/>
      <circle class="star tw3" cx="150" cy="120" r="1.3"/>
      <circle class="star tw2" cx="215" cy="60"  r="2.0"/>
      <circle class="star tw4" cx="300" cy="150" r="1.2"/>
      <circle class="star tw1" cx="345" cy="35"  r="1.5"/>
      <circle class="star tw3" cx="430" cy="90"  r="1.9"/>
      <circle class="star tw2" cx="520" cy="45"  r="1.4"/>
      <circle class="star tw4" cx="565" cy="140" r="1.7"/>
      <circle class="star tw1" cx="640" cy="70"  r="1.3"/>
      <circle class="star tw3" cx="705" cy="160" r="1.6"/>
      <circle class="star tw2" cx="742" cy="30"  r="1.4"/>
      <circle class="star tw4" cx="930" cy="150" r="1.8"/>
      <circle class="star tw1" cx="960" cy="55"  r="1.3"/>
      <circle class="star tw2" cx="55"  cy="185" r="1.4"/>
      <circle class="star tw3" cx="255" cy="205" r="1.2"/>
      <circle class="star tw4" cx="480" cy="195" r="1.5"/>
      <circle class="star tw2" cx="880" cy="200" r="1.3"/>
      <circle class="star tw1" cx="170" cy="235" r="1.3"/>
      <circle class="star tw3" cx="620" cy="225" r="1.4"/>
      <circle class="star tw4" cx="790" cy="240" r="1.2"/>
      <!-- four-point sparkle stars -->
      <path class="star tw2" d="M120 85 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2 z"/>
      <path class="star tw4" d="M600 100 l2 5.4 5.4 2 -5.4 2 -2 5.4 -2 -5.4 -5.4 -2 5.4 -2 z"/>
      <path class="star tw1" d="M395 155 l1.8 5 5 1.8 -5 1.8 -1.8 5 -1.8 -5 -5 -1.8 5 -1.8 z"/>
      <path class="star tw3" d="M340 215 l1.8 5 5 1.8 -5 1.8 -1.8 5 -1.8 -5 -5 -1.8 5 -1.8 z"/>
    </g>

    <!-- shooting stars -->
    <line class="shoot"  x1="700" y1="20" x2="740" y2="6"/>
    <line class="shoot2" x1="380" y1="15" x2="416" y2="2"/>

    <!-- text -->
    <text class="title" x="70" y="128">Taehun Kim</text>
    <text class="subtitle" x="72" y="165">PRODUCT DEVELOPER</text>
  </g>

  <!-- water body: same phase/speed as the sky edge, tucked right under it (no gap) -->
  <path class="waveShift" fill="url(#waveFade1)" d="M-500 244
    Q-437.5 224 -375 244 T-250 244 T-125 244 T0 244 T125 244 T250 244 T375 244 T500 244 T625 244 T750 244 T875 244 T1000 244 T1125 244 T1250 244 T1375 244 T1500 244
    V330 H-500 Z"/>
  <!-- deeper wave crests, visible against the water body -->
  <path class="waveShift3" fill="url(#waveFade2)" d="M-500 292
    Q-437.5 276 -375 292 T-250 292 T-125 292 T0 292 T125 292 T250 292 T375 292 T500 292 T625 292 T750 292 T875 292 T1000 292 T1125 292 T1250 292 T1375 292 T1500 292
    V330 H-500 Z"/>
  <path class="waveShift4" fill="url(#waveFade3)" d="M-500 308
    Q-437.5 322 -375 308 T-250 308 T-125 308 T0 308 T125 308 T250 308 T375 308 T500 308 T625 308 T750 308 T875 308 T1000 308 T1125 308 T1250 308 T1375 308 T1500 308
    V330 H-500 Z"/>
</svg>
